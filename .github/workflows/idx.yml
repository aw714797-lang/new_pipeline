name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '24.x'
  APP_NAME: 'vanilla-app'
  DOCKER_iMAGE: 'vanilla-app'
  CONTAINER_PORT: '8080'
  
jobs:
  ci_stage:
    name: 'Continuous integration'
    runs-on: ubuntu-latest

    steps:     
      - uses: actions/checkout@v4

      - name: Validate Syntax
        run: |
          npm install -g htmlhint
          htmlhint *.html

  cd_stage:
    name: 'Continuous Deployment'
    runs-on: ubuntu-latest
    needs: ci_stage

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH into the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd new_pipeline

            docker build -t ${{ env.DOCKER_IMAGE }}:latest .

            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${{ env.CONTAINER_PORT }}:80 \
              ${{ env.DOCKER_IMAGE }}:latest

            docker tag ${{ env.DOCKER_IMAGE }}:latest ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest

            docker image prune -f
            echo "Deployment successful on port ${{ env.CONTAINER_PORT }}"

