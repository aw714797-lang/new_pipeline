SCP connection refused fix

You fixed the SSH connection! The fact that it says create folder /var/www/html and untar file means the GitHub Action successfully authenticated and connected to your server.

The issue now is a file permission / overwrite problem.

The error tar: index.html: Cannot open: File exists happens because the SCP action is trying to extract the .tar.gz file over an existing index.html on your server, but the user wahab (running the action) does not have permission to overwrite that file (usually because it belongs to root or www-data).

Here is exactly how to fix it:
Solution 1: Add overwrite: true (Easiest)

The appleboy/scp-action has a built-in flag to force overwrite existing files.

Update your Copy Files via SCP step in your workflow to look like this:
yaml

      - name: Copy Files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./*.html"
          target: "/var/www/html"
          strip_components: 0
          overwrite: true  # <--- ADD THIS LINE

Solution 2: Fix Server Permissions (Permanent Fix)

The real issue is that /var/www/html is likely owned by root, and the user wahab can't write to it. You need to change the ownership of that folder so wahab can deploy files.

SSH into your server (via your terminal) and run:
bash

sudo chown -R wahab:wahab /var/www/html

(If your server uses www-data for Nginx, you might need sudo chown -R wahab:www-data /var/www/html instead).
Solution 3: Remove the file before SCP (If you prefer)

If you don't want to use overwrite, you can add a command in your workflow to clean the folder before copying. However, this requires a separate SSH step right before your SCP step:
yaml

      - name: Remove old HTML files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo rm -rf /var/www/html/*.html

      - name: Copy Files via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./*.html"
          target: "/var/www/html"
          strip_components: 0

My recommendation:
Try Solution 1 (overwrite: true) first, and also run Solution 2 (chown) on your server to ensure wahab has permanent write permissions to that directory. This will solve the problem immediately and prevent it from happening on future deployments.
